<h2>Log in</h2>
<p class="hint-block">Demo admin: <strong>admin@sunday.local</strong> / <strong>Admin123!</strong></p>

@if (error()) {
  <p class="error-banner">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
  </div>
  <button type="submit" class="btn-primary" style="width: 100%">Log in</button>
</form>

<p class="footer-link">No account? <a routerLink="/auth/register">Register</a></p>

<style>
  h2 {
    margin-bottom: 0.75rem;
  }
  .hint-block {
    font-size: 0.8rem;
    color: var(--color-text-muted);
    background: var(--color-bg);
    padding: 0.6rem;
    border-radius: var(--radius-sm);
    margin-bottom: 1rem;
  }
  .error-banner {
    background: var(--color-danger-bg);
    color: var(--color-danger);
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  .footer-link {
    margin-top: 1rem;
    font-size: 0.9rem;
    text-align: center;
  }
</style>
