<h2>Create account</h2>

@if (error()) {
  <p class="error-banner">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="fullName">Full name</label>
    <input id="fullName" type="text" formControlName="fullName" />
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" />
  </div>
  <div class="form-group">
    <label for="age">Age</label>
    <input id="age" type="number" formControlName="age" />
  </div>
  <div class="form-group">
    <label for="avatar">Profile picture (optional)</label>
    <input id="avatar" type="file" accept="image/*" (change)="onFile($event)" />
    <p class="hint">Max 200KB — stored in browser only.</p>
  </div>
  <div class="form-group">
    <label for="position">Position</label>
    <select id="position" formControlName="position">
      @for (p of positions; track p) {
        <option [value]="p">{{ p }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label for="yearsExperience">Years of experience</label>
    <input id="yearsExperience" type="number" formControlName="yearsExperience" />
  </div>
  <div class="form-group">
    <label for="achievements">Football achievements</label>
    <textarea id="achievements" formControlName="achievements"></textarea>
  </div>
  <div class="form-group">
    <label for="strengths">Playing strengths</label>
    <input id="strengths" type="text" formControlName="strengths" />
  </div>
  <div class="form-group">
    <label for="skillRating">Skill rating (1–10)</label>
    <input id="skillRating" type="number" formControlName="skillRating" min="1" max="10" />
  </div>
  <button type="submit" class="btn-primary" style="width: 100%">Register</button>
</form>

<p class="footer-link">Already have an account? <a routerLink="/auth/login">Log in</a></p>

<style>
  h2 {
    margin-bottom: 1rem;
  }
  .error-banner {
    background: var(--color-danger-bg);
    color: var(--color-danger);
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  .footer-link {
    margin-top: 1rem;
    font-size: 0.9rem;
    text-align: center;
  }
</style>
