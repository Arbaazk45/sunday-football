<div class="page">
  <app-page-header
    [title]="isEdit() ? 'Edit player' : 'Add player'"
    subtitle="Administrator only"
  />

  <form class="card stack" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Full name</label>
      <input type="text" formControlName="fullName" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" />
    </div>
    <div class="form-group">
      <label>Profile picture</label>
      <input type="file" accept="image/*" (change)="onFile($event)" />
    </div>
    <div class="grid-2" style="display: grid; gap: 1rem">
      <div class="form-group">
        <label>Age</label>
        <input type="number" formControlName="age" />
      </div>
      <div class="form-group">
        <label>Position</label>
        <select formControlName="position">
          @for (p of positions; track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Years of experience</label>
      <input type="number" formControlName="yearsExperience" />
    </div>
    <div class="form-group">
      <label>Skill rating (1–10)</label>
      <input type="number" formControlName="skillRating" min="1" max="10" />
    </div>
    <div class="form-group">
      <label>Achievement boost (0–2, affects team balance)</label>
      <input type="number" formControlName="achievementBoost" step="0.5" min="0" max="2" />
    </div>
    <div class="form-group">
      <label>Achievements</label>
      <textarea formControlName="achievements"></textarea>
    </div>
    <div class="form-group">
      <label>Strengths</label>
      <input type="text" formControlName="strengths" />
    </div>
    <div class="row">
      <button type="submit" class="btn-primary">Save</button>
      <a routerLink="/players" class="btn-secondary">Cancel</a>
      @if (isEdit()) {
        <button type="button" class="btn-danger" (click)="deletePlayer()">Delete</button>
      }
    </div>
  </form>
</div>
